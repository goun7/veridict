[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI is `veridict-standard` (the bare `veridict`
# name belongs to a DIFFERENT project — curagus/NodexisLabs, "verify an AI
# agent actually did what it claimed", since 2026-06). Same package, same
# import, same CLI: only `pip install veridict-standard` differs.
name = "veridict-standard"
version = "0.3.3"
description = "The verdict that survived verification — audit AI with AI"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "goun7"}]
requires-python = ">=3.12"
dependencies = ["cryptography>=42.0", "httpx>=0.27"]
keywords = ["ai", "audit", "ledger", "verification", "standards", "evidence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
veridict = "veridict.cli:main"

[tool.setuptools.packages.find]
include = ["veridict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
