name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # regenerate the self-audit badge after the dogfood receipt

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . && pip install pytest cryptography
      - name: Full suite (python -m pytest)
        run: python -m pytest -q
      - name: Full suite (pytest entrypoint)
        run: pytest -q
      - name: Dogfood self-audit (receipt)
        run: |
          python scripts/dogfood.py > dogfood_out.json
          python - <<'EOF'
          import json
          d = json.load(open('dogfood_out.json'))
          if not (d['verification']['valid'] and d['risk_level'] == 'low'
                  and not d['blocked']):
              # print the full W1a rationales of every non-VERIFIED claim —
              # the inner pytest's own output tail rides in the evidence
              # rationale (verifiers.py), so the CI log shows WHY it failed
              led = [json.loads(l) for l in open('dogfood_ledger.jsonl')]
              cert = d.get('cert') or {}
              bad = {c['claim_id'] for c in cert.get('claims', [])
                     if c.get('verdict_value') != 'VERIFIED'}
              print('=== NON-VERIFIED CLAIM EVIDENCE (diagnosis) ===')
              for e in led:
                  p = e.get('payload', {})
                  if e['entry_type'] == 'evidence.recorded' and p.get('claim_id') in bad:
                      print(f"[{p.get('tier')}] {p.get('stance')}: {p.get('rationale')}")
              raise SystemExit(1)
          EOF
      - name: Offline verify of the dogfood certificate
        run: veridict verify --ledger dogfood_ledger.jsonl --cert dogfood_cert.json
      - name: JSON Schema contracts vs reality
        run: |
          pip install jsonschema
          pytest tests/test_json_schemas.py -q
      - name: Dependency CVE scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable --desc off || test $? -eq 1
      - name: Canary quality sheet (caught 10 / fp 0 expected)
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, '.')
          from tests.test_canary import _audit_fn
          from veridict.canary import CanaryRunner
          s = CanaryRunner(_audit_fn()).run('corpus/corpus.jsonl')
          assert s['caught_total'] == 10 and s['false_positives'] == 0, s
          print('canary caught:', s['caught_total'], '| fp:', s['false_positives'])
          EOF
      - name: GATE latency budget (design §6.5, p95 < 30 min)
        run: python scripts/measure_latency.py

  # Badge regeneration runs AFTER the matrix (single job, no push race).
  # On PRs it only verifies the badge can be produced (no push).
  badge:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . && pip install pytest cryptography
      - name: Dogfood + regenerate the self-audit badge (receipt, not decoration)
        run: |
          python scripts/dogfood.py > dogfood_out.json
          python scripts/make_badge.py --cert dogfood_cert.json --ledger dogfood_ledger.jsonl --out docs/assets/veridict-badge.svg --label "veridict self-audit"
          git config user.name "veridict-ci"
          git config user.email "ci@veridict.local"
          git add docs/assets/veridict-badge.svg
          git diff --cached --quiet && echo "badge already current" && exit 0
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((i * 5))
          done
          echo "could not push badge after retries" && exit 1
