name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . && pip install pytest cryptography
      - name: Full suite (python -m pytest)
        run: python -m pytest -q
      - name: Full suite (pytest entrypoint)
        run: pytest -q
      - name: Dogfood self-audit (receipt)
        run: |
          python scripts/dogfood.py > dogfood_out.json
          python -c "import json; d=json.load(open('dogfood_out.json')); assert d['verification']['valid'] and d['risk_level']=='low' and not d['blocked'], d"
      - name: Offline verify of the dogfood certificate
        run: veridict verify --ledger dogfood_ledger.jsonl --cert dogfood_cert.json
      - name: JSON Schema contracts vs reality
        run: |
          pip install jsonschema
          pytest tests/test_json_schemas.py -q
      - name: Dependency CVE scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable --desc off || test $? -eq 1
      - name: Canary quality sheet (caught 9 / fp 0 expected)
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, '.')
          from tests.test_canary import _audit_fn
          from veridict.canary import CanaryRunner
          s = CanaryRunner(_audit_fn()).run('corpus/corpus.jsonl')
          assert s['caught_total'] == 9 and s['false_positives'] == 0, s
          print('canary caught:', s['caught_total'], '| fp:', s['false_positives'])
          EOF
      - name: GATE latency budget (design §6.5, p95 < 30 min)
        run: python scripts/measure_latency.py
